<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SlideGenius</title>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="/config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">SlideGenius</div>

    <nav class="nav">
      <button class="link" data-page="home" id="navHome">الرئيسية</button>
      <button class="link" data-page="templates" id="navTemplates">القوالب</button>
      <button class="link" data-page="editor" id="navEditor">المحرر</button>
      <button class="link" data-page="pricing" id="navPricing">الأسعار</button>
      <a class="link" href="/admin" id="navAdmin">Admin</a>
      <button class="pill" id="btnLang">EN</button>
    </nav>
  </header>

  <main class="container">
    <!-- HOME -->
    <section class="page" id="page-home">
      <h1 data-i18n="home_title">حوّل أفكارك لعروض احترافية خلال ثواني</h1>
      <p class="sub" data-i18n="home_sub">اختاري قالب، ارفعي صورة، اكتبي النص، وصدّري.</p>
      <div class="actions">
        <button class="btn" id="goTemplates" data-i18n="start_now">ابدأ الآن</button>
        <button class="btn ghost" id="goPricing" data-i18n="see_prices">شوف الأسعار</button>
      </div>
    </section>

    <!-- TEMPLATES -->
    <section class="page hidden" id="page-templates">
      <h2 data-i18n="templates_title">القوالب</h2>
      <p class="sub" data-i18n="templates_sub">اختاري قالب ثم انتقلي للمحرر.</p>

      <div class="grid" id="templatesGrid"></div>
    </section>

    <!-- EDITOR -->
    <section class="page hidden" id="page-editor">
      <div class="split">
        <div class="card">
          <h2 data-i18n="editor_title">المحرر</h2>

          <label data-i18n="pick_template">اختيار قالب</label>
          <select id="selTemplate"></select>

          <div class="row2">
            <div>
              <label data-i18n="title_label">العنوان</label>
              <input id="inpTitle" placeholder="مثال: عنوان العرض" />
            </div>
            <div>
              <label data-i18n="color_label">لون</label>
              <input id="inpColor" type="color" value="#1e90ff" />
            </div>
          </div>

          <label data-i18n="body_label">النص</label>
          <textarea id="inpBody" rows="6" placeholder="اكتب/ي هنا..."></textarea>

          <!-- ✅ رفع صورة حقيقية -->
          <label class="mt" data-i18n="image_label">أضف صورة (اختياري)</label>
          <input id="inpImgFile" type="file" accept="image/*" />

          <div class="actions mt">
            <button class="btn" id="btnPreview" data-i18n="preview">تحديث المعاينة</button>
            <button class="btn ghost" id="btnClear" data-i18n="clear">مسح</button>
          </div>

          <div class="hint" id="hintPayPal"></div>
        </div>

        <div class="card">
          <h2 data-i18n="preview_title">المعاينة</h2>
          <div class="previewWrap">
            <div class="slide" id="slidePreview">
              <div class="slideHead" id="prevTitle">عنوان</div>
              <img id="prevImg" class="prevImg hidden" alt="" />
              <div class="slideBody" id="prevBody">النص...</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- PRICING -->
    <section class="page hidden" id="page-pricing">
      <h2 data-i18n="pricing_title">الأسعار</h2>
      <div class="grid2">
        <div class="card">
          <h3 data-i18n="plan_basic">خطة أساسية</h3>
          <p class="sub" data-i18n="plan_basic_desc">للاستخدام الشخصي.</p>
          <div class="price">$9</div>
          <button class="btn" id="btnPay" data-i18n="pay_now">ادفع الآن</button>
          <div class="hint" id="payHint"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a href="/health">health</a>
  </footer>
</body>
</html>
