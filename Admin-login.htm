<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin Login</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <div class="card" style="max-width:640px;margin:40px auto;">
      <h2 style="margin:0 0 10px">لوحة الأدمن</h2>
      <p class="sub" style="margin:0 0 14px">الدخول محمي. اكتب كلمة المرور.</p>

      <div class="row2" style="grid-template-columns:1fr 140px;align-items:end;">
        <div>
          <label>كلمة المرور</label>
          <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
        </div>
        <button class="btn" id="btn">دخول</button>
      </div>

      <div class="hint" id="msg"></div>
    </div>
  </main>

<script>
async function login(){
  const password = document.getElementById("pw").value;
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  msg.textContent = "جاري التحقق…";
  btn.disabled = true;

  try{
    const res = await fetch("/api/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ password })
    });

    if(res.ok){
      msg.textContent = "✅ تم الدخول... تحويل";
      window.location.href = "/admin";
    } else {
      msg.textContent = "❌ كلمة المرور غير صحيحة";
    }
  }catch(e){
    msg.textContent = "❌ خطأ اتصال";
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("btn").addEventListener("click", login);
document.getElementById("pw").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") login();
});
</script>
</body>
</html>
