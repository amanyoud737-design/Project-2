<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>دخول الأدمن</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .wrap{max-width:520px;margin:70px auto;padding:16px}
    .card{background:rgba(16,26,34,.95);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    input{flex:1;min-width:220px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0b1116;color:#fff}
    button{padding:12px 16px;border-radius:12px;border:none;background:#1e90ff;color:#fff;cursor:pointer}
    .msg{min-height:22px;color:#9fb0bf;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2 style="margin:0">لوحة الأدمن</h2>
      <p style="margin:0;color:#9fb0bf">الدخول محمي. اكتب كلمة المرور.</p>
      <div class="row">
        <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
        <button id="btn" onclick="login()">دخول</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

<script>
async function login(){
  const password = document.getElementById("pw").value;
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  msg.textContent = "جاري التحقق…";
  btn.disabled = true;

  try{
    const res = await fetch("/api/admin/login", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ password })
    });

    const data = await res.json().catch(()=> ({}));

    if(res.ok && data.ok){
      window.location.href = "/admin";
      return;
    }
    msg.textContent = data.message || "كلمة المرور خطأ";
  }catch(e){
    msg.textContent = "مشكلة اتصال. جرّبي مرة ثانية.";
  }finally{
    btn.disabled = false;
  }
}
</script>
</body>
</html>
