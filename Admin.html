<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Admin</div>
    <nav class="nav">
      <a class="link" href="/">الرجوع للموقع</a>
      <button class="btn" id="logout">تسجيل خروج</button>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h2 style="margin:0 0 10px">لوحة الأدمن ✅</h2>
      <p class="sub">إذا وصلتي هنا: تسجيل الدخول شغال.</p>
      <div class="hint" id="info"></div>
    </div>
  </main>

<script>
async function load(){
  const r = await fetch("/api/me");
  const j = await r.json();
  document.getElementById("info").textContent = "isAdmin: " + j.isAdmin;
}
document.getElementById("logout").addEventListener("click", async ()=>{
  await fetch("/api/admin/logout", { method:"POST" });
  window.location.href = "/";
});
load();
</script>
</body>
</html>
