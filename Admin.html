<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لوحة الأدمن</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .wrap{max-width:980px;margin:40px auto;padding:16px}
    .card{background:rgba(16,26,34,.95);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    button{padding:10px 14px;border-radius:12px;border:none;background:#1e90ff;color:#fff;cursor:pointer}
    .muted{color:#9fb0bf}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <h2 style="margin:0">🎛️ لوحة التحكم</h2>
        <button onclick="logout()">تسجيل خروج</button>
      </div>

      <p class="muted" style="margin:0">أنت داخل كأدمن ✅</p>

      <hr style="border:0;border-top:1px solid rgba(255,255,255,.08);margin:8px 0">

      <div class="muted">هنا بنضيف إدارة القوالب والأسعار لاحقًا.</div>
    </div>
  </div>

<script>
async function logout(){
  await fetch("/api/admin/logout", { method:"POST" }).catch(()=>{});
  window.location.href = "/";
}
</script>
</body>
</html>
